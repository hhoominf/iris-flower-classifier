<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Flower Classifier</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body class="bg-green-50 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        
        <h1 class="text-3xl font-bold text-green-800 text-center mb-2">Iris Classifier</h1>
        <p class="text-center text-gray-600 mb-6">Enter the flower measurements below to identify the species.</p>
        
        <!-- Input Form -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Sepal Length (cm)</label>
                <input type="number" id="sepalLength" value="5.1" step="0.1" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Sepal Width (cm)</label>
                <input type="number" id="sepalWidth" value="3.5" step="0.1" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Petal Length (cm)</label>
                <input type="number" id="petalLength" value="1.4" step="0.1" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Petal Width (cm)</label>
                <input type="number" id="petalWidth" value="0.2" step="0.1" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
            </div>
        </div>
        
        <!-- Predict Button -->
        <button id="predict-button" class="mt-6 w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors">
            Identify Flower
        </button>
        
        <!-- Result Display -->
        <div id="result-div" class="mt-6 p-4 text-center rounded-md hidden">
            <p class="text-sm text-gray-500 uppercase tracking-wide">Predicted Species</p>
            <p id="prediction-text" class="text-2xl font-bold text-gray-800 mt-1">-</p>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // These values are pre-filled from your Python training script (Step 2.6)
        const SCALER_MEAN = [5.841666666666668, 3.0483333333333342, 3.769999999999999, 1.2049999999999987];
        const SCALER_SCALE = [0.837415003978845, 0.44665111913239636, 1.7611359970201048, 0.7594789880788891];
        const CLASS_NAMES = ['Setosa', 'Versicolor', 'Virginica'];
        const MODEL_PATH = 'classification_model.onnx';

        let session;
        const resultDiv = document.getElementById('result-div');
        const predictionText = document.getElementById('prediction-text');
        const predictButton = document.getElementById('predict-button');

        // --- 1. Load ONNX Model ---
        async function loadModel() {
            try {
                session = await ort.InferenceSession.create(MODEL_PATH);
                console.log("Model loaded successfully");
            } catch (e) {
                console.error("Failed to load model:", e);
                predictionText.textContent = "Error loading model. Check console.";
                resultDiv.classList.remove('hidden');
                resultDiv.classList.add('bg-red-100');
            }
        }

        // --- 2. Run Prediction ---
        async function runPrediction() {
            if (!session) {
                alert("Model is still loading...");
                return;
            }

            try {
                // Get inputs
                const inputs = [
                    parseFloat(document.getElementById('sepalLength').value),
                    parseFloat(document.getElementById('sepalWidth').value),
                    parseFloat(document.getElementById('petalLength').value),
                    parseFloat(document.getElementById('petalWidth').value)
                ];

                // Preprocess (StandardScaler)
                const scaledInputs = inputs.map((val, i) => (val - SCALER_MEAN[i]) / SCALER_SCALE[i]);
                
                // Create Tensor
                const inputTensor = new ort.Tensor('float32', new Float32Array(scaledInputs), [1, 4]);
                
                // Run Inference
                const feeds = { 'input': inputTensor };
                const results = await session.run(feeds);
                
                // Get Output (Log Softmax)
                const outputData = results.output.data;
                
                // Find ArgMax (Class with highest score)
                let maxScore = -Infinity;
                let predictedClassIndex = 0;
                for (let i = 0; i < outputData.length; i++) {
                    if (outputData[i] > maxScore) {
                        maxScore = outputData[i];
                        predictedClassIndex = i;
                    }
                }

                // Display Result
                predictionText.textContent = CLASS_NAMES[predictedClassIndex];
                resultDiv.classList.remove('hidden');
                resultDiv.classList.add('bg-green-100');
                
            } catch (e) {
                console.error("Prediction failed:", e);
                alert("Prediction failed. See console for details.");
            }
        }

        // Initialize
        predictButton.addEventListener('click', runPrediction);
        document.addEventListener('DOMContentLoaded', loadModel);

    </script>
</body>
</html>
